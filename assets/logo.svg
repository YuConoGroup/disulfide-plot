<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Disulfide connectivity logo">
  <rect width="256" height="256" rx="52" fill="#ffffff"/>
  <rect x="1" y="1" width="254" height="254" rx="51" fill="none" stroke="#e4dfd6" stroke-width="2"/>

  <!-- S–S mark -->
  <text x="128" y="58" text-anchor="middle"
        font-family="Didot, 'Bodoni MT', 'Times New Roman', Georgia, serif"
        font-size="18" letter-spacing="5" fill="#6f7a74">S—S</text>

  <!-- two peptide strands -->
  <path d="M86 74 C78 104, 94 132, 86 162 C78 192, 94 210, 86 228"
        fill="none" stroke="#2f3a40" stroke-width="5" stroke-linecap="round"/>
  <path d="M170 74 C178 104, 162 132, 170 162 C178 192, 162 210, 170 228"
        fill="none" stroke="#2f3a40" stroke-width="5" stroke-linecap="round"/>

  <!-- three disulfide rungs -->
  <g stroke-linecap="round">
    <line x1="85" y1="98"  x2="171" y2="98"  stroke="#4e6e6b" stroke-width="4.5"/>
    <line x1="87" y1="140" x2="169" y2="140" stroke="#7e8c5e" stroke-width="4.5"/>
    <line x1="85" y1="182" x2="171" y2="182" stroke="#9b6a6a" stroke-width="4.5"/>
  </g>

  <!-- cysteine nodes -->
  <g fill="#ffffff" stroke="#2f3a40" stroke-width="3">
    <circle cx="86" cy="98" r="6"/>
    <circle cx="170" cy="98" r="6"/>
    <circle cx="87" cy="140" r="6"/>
    <circle cx="169" cy="140" r="6"/>
    <circle cx="86" cy="182" r="6"/>
    <circle cx="170" cy="182" r="6"/>
  </g>

  <!-- baseline accent -->
  <line x1="64" y1="242" x2="192" y2="242" stroke="#d8d2c8" stroke-width="2" stroke-linecap="round"/>
</svg>
